# Storyboard — references a recipe + fills per-deck content.
#
# A recipe (`recipes/<name>.yaml`) defines the *structure* — a sequence of
# beats with purposes and density. This file fills the *content* — the
# headline message and any per-beat overrides for this specific deck.
#
# To make a new deck that's structurally identical to an existing one:
# copy this file, swap the content blocks, point at the same recipe.

memo: ./memo.md
memo_version: 1
status: draft

recipe: pitch-classic          # required — must match recipes/<name>.yaml
theme: taikyoku                # optional — falls back to recipe.default_theme
mix: false                     # if true, allows per-beat theme overrides (rarely useful)

# One entry per beat in the recipe, keyed by purpose.
# If the recipe has two beats with the same purpose, key them as
# `<purpose>:1`, `<purpose>:2`.
content:
  cover:
    key_message: "<one-sentence headline shown on the cover>"
    eyebrow: "<optional small label, e.g. 'For the leadership team'>"

  # Repeat one block per beat:
  # <purpose>:
  #   key_message: "<one sentence>"
  #   bullets: ["...", "...", "..."]      # optional; depends on the beat
  #   sources: ["./sources/<file>"]       # optional; provenance
  #   notes: "<freeform direction for the composer>"
