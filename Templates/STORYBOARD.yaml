# Storyboard — references a recipe + fills per-deck CONTENT (Stream 4 / D2).
#
# A recipe (`recipes/<name>.yaml`) defines the *structure* — a sequence of
# beats with purposes and density. This file fills the *content* — the
# claim, the so-what headline, the concrete facts/quotes, and the source.
#
# What's NOT here (post-Stream-4): components, layouts, grids. Those live
# in `blueprint.yaml`, emitted by the blueprint subagent after storyboard
# approval. If you have layout intent, put it in a beat's `notes` field;
# the blueprint stage reads it.

memo: ./memo.md
memo_version: 1
status: draft

recipe: pitch-classic          # required — must match recipes/<name>.yaml
theme: taikyoku                # optional — falls back to recipe.default_theme
mix: false                     # if true, allows per-beat theme overrides (rarely useful)

# One entry per beat in the recipe, keyed by purpose.
# If the recipe has two beats with the same purpose, key them as
# `<purpose>:1`, `<purpose>:2`.
content:
  cover:
    key_message: "<one-sentence pitch — the deck's whole thesis in one line>"
    action_title: "<the cover headline shown in Prata, Title Case>"
    sub: "<optional one-line subhead>"
    source: ""                                # cover/closing exempt from source
    facts: []                                 # cover/closing usually empty
    quotes: []
    notes: "<freeform — e.g. 'eyebrow = audience descriptor'>"

  # Repeat one block per beat in the recipe. Example content beat:
