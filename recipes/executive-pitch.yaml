name: executive-pitch
description: Cover → section → value → workflow → architecture → closing. Six-beat formal explainer for technically literate executive audiences. Sectioned, with a deliberate closer. Theme-agnostic in principle; ships with default_theme taikyoku.
default_theme: taikyoku

beats:
  - purpose: cover
    density: low
    notes: "Thesis as the cover. Big Prata headline. On Taikyoku: gradient background — the brand handshake. No breath / no ambient motion (Phase 8 — `tk-breath` was removed entirely). One static radial purple glow at low opacity is permitted."

  - purpose: section
    density: low
    notes: "Numbered chapter divider. Centered: section number in muted Prata, AccentRule, vertical hairline, Prata heading. On Taikyoku: gradient background — section dividers carry the brand handshake just like the cover. Reserved KanjiSeal slot renders nothing (seal deferred)."

  - purpose: value
    density: medium
    notes: "Three claims as cards. Each card: italic-Prata role-kicker (small), Prata card title (NOT Helvetica), AccentRule, body in Inter. Lays out the thesis from the cover in three parallel claims. On paper canvas. Honor the slide anatomy: eyebrow + action title + the three-card primary + a supporting cluster (insight or stat-callout) + source + folio."

  - purpose: workflow
    density: medium
    notes: "Sequence of stages or steps. Use `tk-draw` on a horizontal axis with tickmarks; step nodes `tk-fadeUp` as the draw passes them. Each column: numbered step (mono ordinal, JetBrains Mono), Prata title, body. 5 stages is the sweet spot; 4 also works, 6 is a stretch. A `blocked` status uses `accent-negative #9B2226` (semantic-red), not red as decoration."

  - purpose: architecture
    density: high
    notes: "2×2 quadrant grid showing structure. Axes Helvetica Neue tracked caps; plotted-item labels in small Prata (editorial). An optional `highlightQuadrant` uses paper-tint-2 fill + purple accent (no new color). The densest beat — earn it with concrete content (file paths, contracts, names). One long motion (`tk-draw` on the axes), then plotted items fade up."

  - purpose: closing
    density: low
    notes: "Centered Prata headline + the one assigned gold (`accent-hot #FFE1A4`) moment for the deck — set `goldMoment: true` on this Page only (or none, never two). Small caption explaining the headline or next step. On paper canvas. WordmarkLockup is parked — use the brand image asset (`./assets/tkyk-mark.svg`) as the sign-off mark. **No breath, no bookend** — the close is a thesis re-stated, not a thank-you slide."
