# Blueprint — structural review surface (Stream 4 / D5).
#
# NOTE: Manually constructed for Stream 4 / Phase I verification.
# Master-reference has no upstream storyboard (it predates Stream 4);
# storyboard_version: 0 marks this. The blueprint subagent would
# normally derive this from an approved storyboard.yaml.

storyboard: ./storyboard.yaml
storyboard_version: 0           # 0 = no upstream storyboard (Phase I demo)
theme: taikyoku
status: draft                   # one beat approved below → still draft overall

content_area:
  width: 1720
  height: 720
  default_grid: { columns: 12, rows: 6, gap: 24 }

beats:
  # Beat 1 — Field (primary-rail, DRAFT) — demonstrates the default preset
  - id: field
    status: draft
    layout_preset: primary-rail
    grid: { columns: 12, rows: 6, gap: 24 }
    shadows:
      - id: primary
        span: { col: 1..7, row: 1..6 }
        component: image-led
        density: standard
        content_summary: |
          variant=framed; eyebrow "Exhibit A"; heading "On The Ground";
          caption "Q2 site"; placeholder image slot.
      - id: rail-supports
        span: { col: 8..12, row: 1..6 }
        kind: layout-zone
        children:
          - { kind: stat-callout,   content_summary: "3 — Sites audited (all on the same controls data)" }
          - { kind: insight,        content_summary: "The gap the deck closes is visible the moment you stand in the room." }
          - { kind: labelled-list,  content_summary: "Schedule +6 wk slip · Change orders 2 soft · Coverage 100% vs sampled" }

  # Beat 2 — Headline 73% (primary-rail, APPROVED) — demonstrates the badge flip
  - id: headline-73
    status: approved
    layout_preset: primary-rail
    grid: { columns: 12, rows: 6, gap: 24 }
    shadows:
      - id: primary
        span: { col: 1..7, row: 1..6 }
        component: headline-metric
        content_summary: |
          eyebrow "Headline"; value "73%"; label "Pipeline Self-Serve";
          context "Up from 41% a year ago." (count-up sanctioned)
      - id: rail-supports
        span: { col: 8..12, row: 1..6 }
        kind: layout-zone
        children:
          - { kind: stat-callout, content_summary: "41% — A year ago" }
          - { kind: stat-callout, content_summary: "+32pp — Year over year (no added sales headcount)" }
          - { kind: insight,      content_summary: "Self-serve is now the default path — sales-assist is the exception, by design." }

  # Beat 3 — Two-up (two-up, DRAFT) — demonstrates the second preset
  - id: two-up
    status: draft
    layout_preset: two-up
    grid: { columns: 12, rows: 6, gap: 24 }
    shadows:
      - id: a
        span: { col: 1..6, row: 1..5 }
        component: chart-hero
        density: lean
        content_summary: |
          The adoption curve (Chart helper in master-reference);
          inflection at week 8 (onboarding v2 launch).
      - id: b
        span: { col: 7..12, row: 1..5 }
        component: quadrant
        density: lean
        content_summary: |
          Where we sit: Slow→Fast × Generic→True; highlight quadrant 1
          ("Fast, true"); other corners populated.
      - id: takeaway
        span: { col: 1..12, row: 6..6 }
        kind: annotation
        content_summary: |
          "Adoption is bending and the field is empty where we sit —
           the same conclusion from two angles."

  # Beat 4 — Density pushed (dense-grid, DRAFT) — demonstrates a 6-cell preset
  - id: density-pushed
    status: draft
    layout_preset: dense-grid
    grid: { columns: 12, rows: 6, gap: 22 }
    shadows:
      - id: c1
        span: { col: 1..4, row: 1..3 }
        kind: annotation
        content_summary: "01 Capture — Every decision logged at the point it is made."
      - id: c2
        span: { col: 5..8, row: 1..3 }
        kind: annotation
        content_summary: "02 Render — Context becomes a deck, minutes, or a one-pager."
      - id: c3
        span: { col: 9..12, row: 1..3 }
        kind: annotation
        content_summary: "03 Assure — Owner-side, independent, continuous."
      - id: c4
        span: { col: 1..4, row: 4..6 }
        kind: annotation
        content_summary: "04 Compound — Each project sharpens the graph."
      - id: c5
        span: { col: 5..8, row: 4..6 }
        kind: annotation
        content_summary: "05 Govern — Provenance and reversibility by default."
      - id: c6
        span: { col: 9..12, row: 4..6 }
        kind: annotation
        content_summary: "06 Ship — Production-grade output, not slideware."
